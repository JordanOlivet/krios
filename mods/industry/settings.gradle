pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroup('net.fabricmc')
                includeGroup('fabric-loom')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups("org.spongepowered")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Forge'
                    url = uri('https://maven.minecraftforge.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.minecraftforge')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'industry'
include('common')
include('fabric')
include('neoforge')

// Krios: Core is a mod of its own (ADR-018), built from its sibling
// directory: each of its projects stands in for the matching artifact.
includeBuild('../core') {
    dependencySubstitution {
        substitute module('io.lakio.krios.core:krios_core-common') using project(':common')
        substitute module('io.lakio.krios.core:krios_core-fabric') using project(':fabric')
        substitute module('io.lakio.krios.core:krios_core-neoforge') using project(':neoforge')
    }
}
