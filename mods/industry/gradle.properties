# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map.

# Project
version=0.1.1
group=io.lakio.krios
java_version=21

# Common
minecraft_version=1.21.1
mod_name=Krios: Industry
mod_author=Lakio
mod_id=krios_industry
license=LGPL-3.0-or-later
credits=
description=The industrial heart of the Krios ecosystem: quantum/temporal machinery that automates, accelerates and multiplies.
minecraft_version_range=[1.21.1, 1.22)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21
parchment_version=2024.11.10

# Krios: Core (hard dependency, built from ../core by the composite build)
krios_core_version=0.1.0

# Recipe viewers: optional integrations, compiled against the APIs.
# dev_recipe_viewer picks what the dev runs load: jei, emi, both or none.
jei_version=19.21.2.313
emi_version=1.1.24+1.21.1
dev_recipe_viewer=jei

# Fabric
fabric_version=0.109.0+1.21.1
fabric_loader_version=0.16.9
# Team Reborn Energy (bundled jar-in-jar on Fabric)
tre_version=4.1.0

# Forge
forge_version=52.0.28
forge_loader_version_range=[52,)

# NeoForge
neoforge_version=21.1.80
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
