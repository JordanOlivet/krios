plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            // -Pquickplay=<world folder>: open straight into that singleplayer world.
            if (project.hasProperty('quickplay')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('quickplay').toString())
            }
            // -Prehearsal[=background|minimized|normal]: an automated run under Rehearsal, the
            // client test mod (tools/acceptance/client_acceptance.py). Its own game directory,
            // so it never touches the dev client's options and saves, and a fixed window size
            // for screenshots that compare.
            if (project.hasProperty('rehearsal')) {
                gameDirectory = project.file('runs/rehearsal')
                systemProperty('rehearsal', 'true')
                def window = project.property('rehearsal').toString()
                if (window in ['background', 'minimized']) {
                    systemProperty('rehearsal.window', window)
                }
                programArguments.addAll('--width', '1280', '--height', '720')
            }
            // -Pquickplayserver=<host:port>: join that server at launch (a client against a
            // dedicated server: what single player never sends over the wire).
            if (project.hasProperty('quickplayserver')) {
                programArguments.addAll('--quickPlayMultiplayer', project.property('quickplayserver').toString())
            }
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // Krios: Core, a mod on the classpath in dev and a declared dependency in the jar.
    implementation("io.lakio.krios.core:krios_core-neoforge:${krios_core_version}") {
        capabilities {
            requireCapability 'io.lakio.krios.core:krios_core'
        }
    }
}

// Runtime of this build's own dev runs only: unlike runtimeOnly, a build
// that includes this one (composite) does not inherit it.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Recipe viewers (optional at runtime): compiled against their APIs only.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "dev.emi:emi-xplat-mojmap:${emi_version}:api"
    if (dev_recipe_viewer in ['jei', 'both']) {
        // -Pjei_runtime_version=<version>: run against another JEI than the API compiled against.
        localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${findProperty('jei_runtime_version') ?: jei_version}"
    }
    if (dev_recipe_viewer in ['emi', 'both']) {
        localRuntime "dev.emi:emi-neoforge:${emi_version}"
    }
    // Rehearsal joins a run that asks for it (-Prehearsal): the jar its checkout built,
    // named by rehearsal.dir in the repository's local.properties (gitignored).
    if (project.hasProperty('rehearsal')) {
        def local = new Properties()
        def localFile = rootProject.file('../../local.properties')
        if (localFile.exists()) {
            localFile.withInputStream { local.load(it) }
        }
        def checkout = local.getProperty('rehearsal.dir')
        def jars = checkout == null ? [] : (new File(checkout, 'output').listFiles() ?: []).findAll {
            it.name ==~ /rehearsal-neoforge-${minecraft_version}-.*\.jar/
        }
        if (jars.isEmpty()) {
            throw new GradleException("-Prehearsal needs rehearsal.dir in local.properties (see "
                    + "local.properties.example) and a Rehearsal build there for Minecraft ${minecraft_version}")
        }
        localRuntime files(jars.max { it.lastModified() })
    }
}
