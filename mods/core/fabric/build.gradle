plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // Recipe viewers (optional at runtime): compiled against their APIs only.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "dev.emi:emi-xplat-mojmap:${emi_version}:api"
    if (dev_recipe_viewer in ['jei', 'both']) {
        modLocalRuntime "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
    }
    if (dev_recipe_viewer in ['emi', 'both']) {
        modLocalRuntime "dev.emi:emi-fabric:${emi_version}"
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            // -Pquickplay=<world folder>: open straight into that singleplayer world.
            if (project.hasProperty('quickplay')) {
                programArgs '--quickPlaySingleplayer', project.property('quickplay').toString()
            }
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        // ADR-035: Fabric API's game test server runs every registered test, writes a
        // JUnit report and exits with the number of failures (tools/acceptance/gametest.py).
        gametest {
            server()
            setConfigName('Fabric Game Test')
            property('fabric-api.gametest', 'true')
            property('fabric-api.gametest.report-file', project.file('runs/gametest/junit.xml').absolutePath)
            runDir('runs/gametest')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// The dev (named) jar as a variant of its own: the content mods' composite
// builds compile and run against it (the default variants carry the
// remapped jar, which only Loom's mod configurations can read).
configurations {
    devElements {
        canBeConsumed = true
        canBeResolved = false
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
        }
        outgoing.capability("${group}:${mod_id}-fabric-dev:${version}")
    }
}
artifacts {
    devElements(tasks.named('jar'))
}
