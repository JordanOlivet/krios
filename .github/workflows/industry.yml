name: Industry CI

on:
  push:
    branches: [main]
    paths:
      - 'mods/industry/**'
      - 'mods/core/**'
      - 'tools/check_assets.py'
      - 'tools/acceptance/gametest.py'
      - '.github/workflows/industry.yml'
  pull_request:
    paths:
      - 'mods/industry/**'
      - 'mods/core/**'
      - 'tools/check_assets.py'
      - 'tools/acceptance/gametest.py'
      - '.github/workflows/industry.yml'

jobs:
  build:
    uses: JordanOlivet/ci-workflows/.github/workflows/build-gradle-mod.yml@main
    with:
      working-directory: mods/industry
      artifact-name: krios_industry-jars
      # Industry loads core: both mods' assets are checked and both mods' game tests run, on both loaders.
      checks: uv run tools/check_assets.py && uv run tools/acceptance/gametest.py
