name: Core Release

# Push a tag core/v<mods/core/gradle.properties version>[-<pre-release>]
# (ADR-009, e.g. core/v0.1.0) to build both loader jars at that version and
# publish them to Modrinth, CurseForge and a GitHub Release (ADR-010). A tag
# without a pre-release label publishes as a release, -alpha.N as alpha,
# -beta.N / -rc.N as beta. Needs the repository variables CORE_MODRINTH_ID
# and CORE_CURSEFORGE_ID (project ids, not slugs) and the secrets
# MODRINTH_TOKEN and CURSEFORGE_TOKEN (an empty id skips that platform).
#
# Run it by hand (Actions > Core Release > Run workflow) to publish an
# existing tag again to the platforms ticked: a store that failed, a project
# that was not ready. The GitHub Release is off by default there (it exists).

on:
  push:
    tags: ['core/v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing tag, core/v<version>'
        required: true
        type: string
      modrinth:
        description: 'Publish to Modrinth'
        type: boolean
        default: true
      curseforge:
        description: 'Publish to CurseForge'
        type: boolean
        default: true
      github-release:
        description: 'Create or update the GitHub Release'
        type: boolean
        default: false

jobs:
  publish:
    permissions:
      contents: write
    uses: JordanOlivet/ci-workflows/.github/workflows/publish-mod.yml@v1
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      tag-prefix: core/
      mod-name: 'Krios: Core'
      working-directory: mods/core
      changelog-paths: mods/core
      game-versions: 1.21.1
      modrinth-id: ${{ (github.event_name == 'push' || inputs.modrinth) && vars.CORE_MODRINTH_ID || '' }}
      curseforge-id: ${{ (github.event_name == 'push' || inputs.curseforge) && vars.CORE_CURSEFORGE_ID || '' }}
      github-release: ${{ github.event_name == 'push' || inputs.github-release }}
      targets: >-
        [{"loader":"neoforge","label":"NeoForge","files":"neoforge/build/libs/krios_core-neoforge-*.jar"},
         {"loader":"fabric","label":"Fabric","files":"fabric/build/libs/krios_core-fabric-*.jar"}]
    secrets:
      modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
      curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
